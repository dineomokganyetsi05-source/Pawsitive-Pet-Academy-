<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enquire | Pawsitive Pet Academy</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>

        <nav>

            <a href="index.html" class="logo">
                <img src="images/logo.png" alt="Pawsitive Pet Academy Logo">
            </a>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="courses.html">Courses</a></li>
                <li><a href="quote.html">Quote</a></li>
                <li><a href="enquire.html">Enquire</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>

            <a href="quote.html" class="button">
                Get A Quote
            </a>

        </nav>

    </header>


    <main>

        <section>

            <h1>Enquire</h1>

            <p>
                Have a question about our courses?
                Send us an enquiry.
            </p>


            <form action="confirmation.html" method="get">

                <label for="name">
                    Full Name
                </label>

                <input
                    id="name"
                    name="name"
                    type="text"
                    required
                >


                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    required
                >


                <label for="phone">
                    Phone Number
                </label>

                <input
                    id="phone"
                    name="phone"
                    type="tel"
                >


                <label for="course">
                    Course
                </label>

                <select id="course" name="course">

                    <option>
                        Canine Obedience Training
                    </option>

                    <option>
                        Pet Grooming
                    </option>

                    <option>
                        Animal Behaviour
                    </option>

                    <option>
                        Puppy Care
                    </option>

                    <option>
                        Pet First Aid
                    </option>

                </select>


                <label for="message">
                    Message
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    required
                ></textarea>


                <button type="submit" class="button">
                    Send Enquiry
                </button>

            </form>

        </section>

    </main>


    <footer>

        <p>
            © 2026 Pawsitive Pet Academy · Durban, South Africa
        </p>

    </footer>

</body>
</html>
